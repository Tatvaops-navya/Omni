services:
  # ─── FastAPI Backend ─────────────────────────────────────────────────────────
  - type: web
    name: aadhya-backend
    env: python
    region: singapore                 # Closest to India
    plan: free

    buildCommand: pip install -r requirements.txt && cd admin-ui && npm install && npm run build

    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      # Required for WhatsApp list-picker buttons (service menu + MCQ questions)
      - key: TWILIO_WHATSAPP_QUICK_REPLY
        value: "true"
      - key: TWILIO_SERVICE_SELECTION_CONTENT_SID
        sync: false
      - key: TWILIO_WHATSAPP_INTERACTIVE_CONTENT_SID
        sync: false
      - key: TWILIO_MCQ_LIST_5_CONTENT_SID
        sync: false
      - key: TWILIO_MCQ_LIST_4_CONTENT_SID
        sync: false
      - key: TWILIO_MCQ_LIST_1_CONTENT_SID
        sync: false
      - key: TWILIO_MCQ_LIST_2_CONTENT_SID
        sync: false
      - key: VAPI_API_KEY
        sync: false
      - key: VAPI_ASSISTANT_ID
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: SESSION_TTL_HOURS
        value: "24"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: TATVA_USERS_API_BASE_URL
        value: https://api.withtatva.ai
      # Set to your Render URL after first deploy, e.g. https://aadhya-backend.onrender.com (no trailing slash)
      - key: BASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: "*"
